<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0,
          user-scalable=no, interactive-widget=resizes-content">
    <title>Explorador de Fonemas e Sílabas</title>
    <style>
        :root {
            --primary:    #1A252C;
            --accent:     #E74C3C;
            --bg:         #F0F3F4;
            --surface:    #FFFFFF;
            --border:     #DFE6EC;
            --text:       #2C3E50;
            --muted:      #7F8C8D;
            --lock-bg:    #FFF4E6;
            --lock-color: #A04000;
            --lock-border:#E67E22;
            --c-rima:     #27AE60;
            --c-eco:      #2980B9;
            --c-ass:      #E67E22;
            --c-prox:     #8E44AD;
            --c-ritmo:    #7F8C8D;
            --safe-b:     env(safe-area-inset-bottom, 0px);
        }

        *, *::before, *::after {
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: var(--bg); color: var(--text);
            margin: 0; padding: 0;
            display: flex; flex-direction: column;
            height: 100dvh; overflow: hidden;
        }

        /* ────────────────────────────────────────────────────────
           ZONA DE LEITURA  (topo — espaço livre para os resultados)
           overscroll-behavior: evita pull-to-refresh acidental
        ──────────────────────────────────────────────────────── */
        #viewport {
            flex: 1; overflow-y: auto; overflow-x: hidden;
            overscroll-behavior-y: contain;
        }

        /* Header sticky: contagem + chips de faixa */
        .results-header {
            position: sticky; top: 0; z-index: 10;
            background: rgba(240,243,244,0.94);
            backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px);
            padding: 9px 14px;
            display: flex; align-items: center; flex-wrap: wrap; gap: 5px;
            border-bottom: 1px solid var(--border);
        }
        .count-label { font-size: 13px; font-weight: 700; color: var(--muted); flex-shrink: 0; margin-right: 2px; }
        .band-chip   { font-size: 11px; font-weight: 700; padding: 2px 8px; border-radius: 20px; color: white; }

        /* Estado vazio / carregando */
        .empty-state {
            padding: 52px 24px; text-align: center;
            color: var(--muted); font-size: 15px; line-height: 1.7;
        }
        .loader {
            display: block; width: 26px; height: 26px; margin: 0 auto 12px;
            border-radius: 50%;
            border: 3px solid rgba(0,0,0,0.08); border-top-color: var(--accent);
            animation: spin 0.8s linear infinite;
        }
        @keyframes spin { to { transform: rotate(360deg); } }

        /* Grade de resultados */
        .results-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(108px, 1fr));
            gap: 9px; padding: 12px 12px 16px;
        }
        .word-card {
            background: var(--surface); border: 2px solid var(--border);
            border-radius: 12px; padding: 13px 6px 9px;
            text-align: center; font-size: 15px; font-weight: 500;
            cursor: pointer; user-select: none;
            transition: transform 0.1s;
        }
        .word-card:active { transform: scale(0.91); }
        /* Cores de faixa — apenas a borda muda */
        .word-card.b-rima  { border-color: var(--c-rima); }
        .word-card.b-eco   { border-color: var(--c-eco); }
        .word-card.b-ass   { border-color: var(--c-ass); }
        .word-card.b-prox  { border-color: var(--c-prox); }
        .word-card.b-ritmo { border-color: var(--c-ritmo); }
        .tonica { font-weight: 800; color: var(--accent); }

        @media (min-width: 540px) {
            .results-grid { grid-template-columns: repeat(auto-fill, minmax(124px, 1fr)); }
        }

        /* ────────────────────────────────────────────────────────
           ZONA DO POLEGAR  (painel inferior — Bottom Sheet)
           Os controles nunca saem do alcance do polegar.
        ──────────────────────────────────────────────────────── */
        #bottom-panel {
            flex-shrink: 0;
            background: var(--surface);
            border-radius: 18px 18px 0 0;
            box-shadow: 0 -3px 20px rgba(0,0,0,0.08);
            z-index: 100;
            display: flex; flex-direction: column;
            padding-bottom: var(--safe-b);
        }

        /* Handle: arraste ou toque para colapsar/expandir */
        .handle-zone {
            padding: 10px 0 0; cursor: pointer;
            display: flex; justify-content: center;
            user-select: none;
        }
        .handle {
            width: 38px; height: 4px;
            background: var(--border); border-radius: 2px;
            transition: background 0.2s;
        }
        .handle-zone:active .handle { background: var(--muted); }

        /* Abas — sempre visíveis, mesmo no estado colapsado */
        .tabs {
            display: flex; padding: 0 16px;
            border-bottom: 1px solid var(--border);
        }
        .tab-btn {
            flex: 1; background: none; border: none;
            padding: 11px 0; font-size: 14px; font-weight: 700;
            color: var(--muted); cursor: pointer;
            position: relative; transition: color 0.15s;
        }
        .tab-btn.active { color: var(--primary); }
        .tab-btn.active::after {
            content: ''; position: absolute; bottom: -1px; left: 20%; width: 60%;
            height: 3px; background: var(--accent); border-radius: 3px 3px 0 0;
        }

        /* Wrapper animado — colapsa via max-height */
        .tab-wrapper {
            max-height: 46vh;
            transition: max-height 0.3s cubic-bezier(0.25, 1, 0.5, 1);
            overflow: hidden;
        }
        #bottom-panel.collapsed .tab-wrapper { max-height: 0; }

        .tab-content {
            display: none; padding: 14px 16px 10px;
            overflow-y: auto; max-height: 42vh;
            overscroll-behavior-y: contain;
        }
        .tab-content.active { display: block; }

        /* ── ABA MOLDE ── */
        .search-wrap { position: relative; margin-bottom: 12px; }
        .search-wrap input {
            width: 100%; padding: 13px 46px 13px 14px;
            font-size: 16px; font-weight: 600;
            background: var(--bg); border: 2px solid var(--border);
            border-radius: 12px; outline: none; transition: border 0.2s;
        }
        .search-wrap input:focus  { border-color: var(--accent); background: white; }
        .search-wrap input:disabled { opacity: 0.45; }

        #btn-mic {
            position: absolute; right: 10px; top: 50%; transform: translateY(-50%);
            background: none; border: none; font-size: 19px; cursor: pointer;
            padding: 5px; border-radius: 8px; line-height: 1;
            display: none;           /* aparece só se SpeechRecognition disponível */
        }
        #btn-mic.visible   { display: flex; align-items: center; }
        #btn-mic.listening { animation: pulse 1s ease infinite; }
        @keyframes pulse { 0%,100% { opacity: 1; } 50% { opacity: 0.35; } }

        /* Lego pills */
        .lego-panel { display: flex; flex-wrap: wrap; gap: 7px; min-height: 32px; }
        .lego-hint  { font-size: 13px; color: var(--muted); align-self: center; }

        .lego-pill {
            background: var(--bg); border: 2px solid var(--border);
            padding: 6px 12px; border-radius: 20px;
            font-size: 13px; font-weight: 600; color: var(--muted);
            cursor: pointer; user-select: none;
            display: flex; align-items: center; gap: 4px;
            transition: transform 0.1s, border-color 0.1s;
        }
        .lego-pill:active { transform: scale(0.91); }
        .lego-pill.locked {
            background: var(--lock-bg);
            border-color: var(--lock-border);
            color: var(--lock-color);
        }

        #status-text { font-size: 11px; color: var(--muted); margin-top: 10px; text-align: center; }

        /* ── ABA CONSTRUTOR ── */
        .builder-section { margin-bottom: 18px; }
        .builder-label {
            display: block; font-size: 11px; font-weight: 700; letter-spacing: 0.6px;
            text-transform: uppercase; color: var(--muted); margin-bottom: 9px;
        }

        /* Stepper de sílabas */
        .stepper { display: flex; align-items: center; gap: 10px; }
        .step-btn {
            width: 44px; height: 44px; border-radius: 12px;
            border: 2px solid var(--border); background: var(--bg);
            font-size: 22px; font-weight: 700; color: var(--primary);
            cursor: pointer; display: flex; align-items: center; justify-content: center;
            transition: transform 0.1s, background 0.1s;
        }
        .step-btn:active { transform: scale(0.88); background: var(--border); }
        .step-val { font-size: 18px; font-weight: 800; min-width: 88px; text-align: center; }

        /* Radio de acentuação */
        .radio-row { display: flex; gap: 6px; flex-wrap: wrap; }
        .radio-btn {
            padding: 8px 12px; border-radius: 10px;
            border: 2px solid var(--border); background: var(--bg);
            font-size: 13px; font-weight: 600; color: var(--muted);
            cursor: pointer; white-space: nowrap;
            transition: transform 0.1s;
        }
        .radio-btn:active  { transform: scale(0.91); }
        .radio-btn.selected { background: var(--primary); border-color: var(--primary); color: white; }

        /* Grid de vogais */
        .vowel-row { display: flex; gap: 8px; }
        .vowel-btn {
            width: 48px; height: 48px; border-radius: 50%;
            border: 2px solid var(--border); background: var(--bg);
            font-size: 18px; font-weight: 800; color: var(--muted);
            cursor: pointer; display: flex; align-items: center; justify-content: center;
            transition: transform 0.1s;
        }
        .vowel-btn:active   { transform: scale(0.88); }
        .vowel-btn.selected {
            background: var(--accent); border-color: var(--accent);
            color: white; box-shadow: 0 3px 10px rgba(231,76,60,0.35);
        }
    </style>
</head>
<body>

<!-- ══════════════════════════════════════════════════════════
     ZONA DE LEITURA
══════════════════════════════════════════════════════════ -->
<div id="viewport">
    <div class="results-header" id="results-header" style="display:none">
        <span class="count-label" id="count-label"></span>
        <div id="bands-chips"></div>
    </div>
    <div class="results-grid" id="grid">
        <div class="empty-state" id="empty-state">
            <span class="loader"></span>
            Carregando banco de palavras…
        </div>
    </div>
    <div id="sentinel"></div>
</div>

<!-- ══════════════════════════════════════════════════════════
     ZONA DO POLEGAR — Bottom Sheet
══════════════════════════════════════════════════════════ -->
<div id="bottom-panel">
    <div class="handle-zone" onclick="togglePanelCollapse()">
        <div class="handle"></div>
    </div>

    <div class="tabs">
        <button class="tab-btn active" id="tab-btn-molde"      onclick="switchTab('molde')">🔍 Molde</button>
        <button class="tab-btn"        id="tab-btn-construtor" onclick="switchTab('construtor')">🏗 Construtor</button>
    </div>

    <div class="tab-wrapper">

        <!-- ABA: MOLDE
             Busca a partir de uma palavra-base. As características extraídas
             viram blocos (lego pills) que se travam/destravem individualmente.
             Bloco travado = filtro absoluto sobre os resultados.
        -->
        <div id="tab-molde" class="tab-content active">
            <div class="search-wrap">
                <input type="search" id="input-palavra"
                       placeholder="Digite uma palavra-base…"
                       inputmode="search" enterkeyhint="search"
                       autocorrect="off" autocapitalize="none"
                       spellcheck="false" disabled>
                <button id="btn-mic" title="Busca por voz">🎤</button>
            </div>
            <div class="lego-panel" id="lego-panel">
                <span class="lego-hint">Digite uma palavra para extrair blocos fonéticos.</span>
            </div>
            <div id="status-text"></div>
        </div>

        <!-- ABA: CONSTRUTOR
             Monta uma busca sem palavra-base, direto pelos critérios estruturais.
             Cada controle ativo vira um filtro absoluto no dicionário inteiro.
        -->
        <div id="tab-construtor" class="tab-content">
            <div class="builder-section">
                <span class="builder-label">Número de sílabas</span>
                <div class="stepper">
                    <button class="step-btn" onclick="stepSilabas(-1)">−</button>
                    <span class="step-val" id="step-val">Qualquer</span>
                    <button class="step-btn" onclick="stepSilabas(+1)">+</button>
                </div>
            </div>
            <div class="builder-section">
                <span class="builder-label">Acentuação</span>
                <div class="radio-row">
                    <button class="radio-btn selected" data-acento=""    onclick="setAcento(null, this)">Qualquer</button>
                    <button class="radio-btn"          data-acento="ox"  onclick="setAcento('ox',  this)">Oxítona</button>
                    <button class="radio-btn"          data-acento="px"  onclick="setAcento('px',  this)">Paroxítona</button>
                    <button class="radio-btn"          data-acento="ppx" onclick="setAcento('ppx', this)">Proparox.</button>
                </div>
            </div>
            <div class="builder-section">
                <span class="builder-label">Vogal tônica</span>
                <div class="vowel-row">
                    <button class="vowel-btn" data-vogal="a" onclick="setVogal('a', this)">A</button>
                    <button class="vowel-btn" data-vogal="e" onclick="setVogal('e', this)">E</button>
                    <button class="vowel-btn" data-vogal="i" onclick="setVogal('i', this)">I</button>
                    <button class="vowel-btn" data-vogal="o" onclick="setVogal('o', this)">O</button>
                    <button class="vowel-btn" data-vogal="u" onclick="setVogal('u', this)">U</button>
                </div>
            </div>
        </div>

    </div><!-- /tab-wrapper -->
</div><!-- /bottom-panel -->

<script>
'use strict';
/* ═══════════════════════════════════════════════════════════════
   1. MOTOR FONÉTICO — silabificação (inalterado desde v1)
═══════════════════════════════════════════════════════════════ */
const vRegex = /[aeiouáàâãéêíóôõúü]/i;

function tratarHiatosVogais(blocoVoc, pLower) {
    if (blocoVoc.length <= 1) return [blocoVoc];
    let resultado = [], atual = blocoVoc[0];
    for (let i = 1; i < blocoVoc.length; i++) {
        let char = blocoVoc[i], par = (atual.slice(-1) + char).toLowerCase();
        let formamDitongo   = /^(ai|au|ei|eu|iu|oi|ou|ui|ão|õe|ãe|ia|ie|io|ua|ue|uo)$/.test(par);
        let vogaisIdenticas = par[0] === par[1];
        let temHiatoAcent   = /[aeiouáéíóúâêôãõü][íú]/.test(par);
        let ehHiatoFinal    = /^(ai|ui|au|oe)$/.test(par) &&
                              (pLower.endsWith(par+"r")||pLower.endsWith(par+"z")||pLower.endsWith(par+"l"));
        let seguidoDeNh     = pLower.includes(par+"nh");
        let formaHiatoDit   = false;
        if (blocoVoc.length >= 3 && /^[aeo]$/.test(atual.slice(-1))) {
            let prox = blocoVoc[i+1] ? blocoVoc[i+1].toLowerCase() : "";
            if (/^(iu|ia|io|ie|ui)$/.test(char+prox)) formaHiatoDit = true;
        }
        if (formamDitongo && !temHiatoAcent && !vogaisIdenticas && !ehHiatoFinal && !seguidoDeNh && !formaHiatoDit)
            atual += char;
        else { resultado.push(atual); atual = char; }
    }
    resultado.push(atual);
    return resultado;
}

function separarConsoantes(cBlock) {
    if (cBlock.length <= 1) return ["", cBlock];
    let tL = cBlock.toLowerCase();
    if (cBlock.length === 2) {
        if (/^(ch|lh|nh|gu|qu|br|cr|dr|fr|gr|pr|tr|vr|bl|cl|fl|gl|pl|tl)$/.test(tL)) return ["", cBlock];
        return [cBlock.slice(0,1), cBlock.slice(1)];
    }
    if (/^(ch|lh|nh|gu|qu|br|cr|dr|fr|gr|pr|tr|vr|bl|cl|fl|gl|pl|tl)$/.test(tL.slice(-2)))
        return [cBlock.slice(0,-2), cBlock.slice(-2)];
    return [cBlock.slice(0,-1), cBlock.slice(-1)];
}

function silabificar(palavra) {
    let blocos = [], tipoAt = '', textoAt = '';
    for (let i = 0; i < palavra.length; i++) {
        let ch = palavra[i], chL = ch.toLowerCase();
        if ((chL==='q'||chL==='g') && palavra[i+1] && palavra[i+1].toLowerCase()==='u'
            && palavra[i+2] && vRegex.test(palavra[i+2])) {
            if (tipoAt==='V') { blocos.push({tipo:'V',texto:textoAt}); textoAt=''; }
            blocos.push({tipo:'C',texto:ch+palavra[i+1]}); i++; tipoAt=''; continue;
        }
        let tipo = vRegex.test(ch) ? 'V' : 'C';
        if (tipo !== tipoAt) { if (textoAt) blocos.push({tipo:tipoAt,texto:textoAt}); tipoAt=tipo; textoAt=ch; }
        else textoAt += ch;
    }
    if (textoAt) blocos.push({tipo:tipoAt,texto:textoAt});
    let bExp = [];
    for (let b of blocos) {
        if (b.tipo==='V') tratarHiatosVogais(b.texto, palavra.toLowerCase()).forEach(v=>bExp.push({tipo:'V',texto:v}));
        else bExp.push(b);
    }
    let idxV = bExp.reduce((a,b,i)=>(b.tipo==='V'?[...a,i]:a),[]);
    if (!idxV.length) return [palavra];
    let sil = new Array(idxV.length).fill("");
    for (let i=0; i<idxV[0]; i++) sil[0] += bExp[i].texto;
    for (let k=0; k<idxV.length-1; k++) {
        sil[k] += bExp[idxV[k]].texto;
        let cT=""; for (let j=idxV[k]+1; j<idxV[k+1]; j++) cT+=bExp[j].texto;
        let [esq,dir] = separarConsoantes(cT); sil[k]+=esq; sil[k+1]+=dir;
    }
    let uV = idxV[idxV.length-1];
    sil[sil.length-1] += bExp[uV].texto;
    for (let i=uV+1; i<bExp.length; i++) sil[sil.length-1]+=bExp[i].texto;
    return sil;
}

function identificarTonica(silabas, p) {
    let t = p.toLowerCase();
    for (let i=0;i<silabas.length;i++) if(/[áéíóúâêô]/i.test(silabas[i])) return i;
    for (let i=0;i<silabas.length;i++) if(/[ãõ]/i.test(silabas[i])) return i;
    if (t.match(/(r|l|z|x|i|is|u|us|im|ins|um|uns)$/)) return silabas.length-1;
    if (t.match(/(a|as|e|es|o|os|am|em|ens)$/))        return Math.max(0,silabas.length-2);
    return Math.max(0,silabas.length-2);
}

/* ═══════════════════════════════════════════════════════════════
   2. CAMPOS FONÉTICOS
═══════════════════════════════════════════════════════════════ */
function normV(s) {
    // ã e õ são preservados — classe nasal é foneticamente distinta
    return s.toLowerCase()
        .replace(/[áàâ]/g,'a').replace(/[éê]/g,'e').replace(/í/g,'i')
        .replace(/[óô]/g,'o').replace(/[úü]/g,'u');
}

const CLUSTER_FAM = {
    br:'pl',cr:'pl',dr:'pl',fr:'fl',gr:'pl',pr:'pl',tr:'pl',vr:'fl',
    bl:'pl',cl:'pl',fl:'fl',gl:'pl',pl:'pl',tl:'pl',
    ch:'af',lh:'lp',nh:'np'
};
const ACENT_LABEL = { ox:'Oxítona', px:'Paroxítona', ppx:'Proparoxítona', spx:'Superproparox.' };
const FAM_LABEL   = {
    pl:'plosiva+líquida', fl:'fricativa+líquida', af:'africada',
    lp:'lateral palatal', np:'nasal palatal', si:'simples', vz:'—', cx:'complexo'
};

function calcOnset(sil)        { let m=sil.match(/^([^aeiouáàâãéêíóôõúü]*)/i); return m?m[1].toLowerCase():''; }
function calcVogalT(sil)       { let m=sil.match(/[aeiouáàâãéêíóôõúü]/i); return m?normV(m[0]):''; }
function calcVogaisRima(sil,ti){ return normV(sil.slice(ti).join('')).replace(/[^aeiouãõ]/g,''); }
function calcEspinha(p)        { return normV(p).replace(/[^aeiouãõ]/g,''); }
function calcAssC(sil,ti) {
    let span = sil.slice(ti).join('').toLowerCase().replace(/[aeiouáàâãéêíóôõúü]/g,'');
    return [...new Set(span)].sort().join('');
}
function calcFam(o)  { return !o?'vz':o.length===1?'si':(CLUSTER_FAM[o]||'cx'); }
function calcAcent(sil,ti) { let d=sil.length-1-ti; return d===0?'ox':d===1?'px':d===2?'ppx':'spx'; }
function extrairRima(sil,ti)   { let pf=sil.slice(ti).join(''),m=pf.match(vRegex); return m?pf.slice(m.index).toLowerCase():pf.toLowerCase(); }

function perfilFonetico(palavra) {
    let pL = palavra.toLowerCase().trim();
    if (!pL || !/[a-záàâãéêíóôõúü]/i.test(pL)) return null;
    let sil = silabificar(pL), ti = identificarTonica(sil, pL), onset = calcOnset(sil[ti]);
    return {
        palavra:        pL,
        silabas:        sil,
        tonicaIndex:    ti,
        numSilabas:     sil.length,
        acentuacao:     calcAcent(sil, ti),
        rimaPerfeita:   extrairRima(sil, ti),
        vogaisRima:     calcVogaisRima(sil, ti),
        onsetTonico:    onset,
        vogalTonica:    calcVogalT(sil[ti]),
        espinhaVocal:   calcEspinha(pL),
        assConsonantal: calcAssC(sil, ti),
        familiaCluster: calcFam(onset),
    };
}

/* ═══════════════════════════════════════════════════════════════
   3. SCORE COMPOSTO + FAIXAS
═══════════════════════════════════════════════════════════════ */
function calcScore(item, alvo, setOnset, setAssC, lenAssC) {
    let s = 0;
    if (item.rimaPerfeita === alvo.rimaPerfeita)                     s += 100;
    if (alvo.vogaisRima && item.vogaisRima === alvo.vogaisRima)      s +=  60;
    if (alvo.onsetTonico) {
        if (item.onsetTonico === alvo.onsetTonico) {
            s += 50;
        } else if (item.onsetTonico) {
            for (let c of item.onsetTonico) if (setOnset.has(c)) { s += 25; break; }
        }
    }
    if (alvo.familiaCluster !== 'vz' && alvo.familiaCluster !== 'si'
        && item.familiaCluster === alvo.familiaCluster)              s += 20;
    if (lenAssC > 0 && item.assConsonantal) {
        let inter = 0;
        for (let c of item.assConsonantal) if (setAssC.has(c)) inter++;
        let union = lenAssC + item.assConsonantal.length - inter;
        if (union > 0 && inter / union >= 0.5)                      s += 30;
    }
    if (alvo.espinhaVocal.length > 1 && item.espinhaVocal === alvo.espinhaVocal) s += 40;
    if (alvo.vogalTonica && item.vogalTonica === alvo.vogalTonica)   s +=  15;
    if (item.numSilabas === alvo.numSilabas && item.acentuacao === alvo.acentuacao) s += 10;
    return s;
}

const BANDAS = [
    { key:160, label:'Rima',        cls:'b-rima',  color:'#27AE60' },
    { key:100, label:'Eco forte',   cls:'b-eco',   color:'#2980B9' },
    { key:60,  label:'Assonância',  cls:'b-ass',   color:'#E67E22' },
    { key:25,  label:'Proximidade', cls:'b-prox',  color:'#8E44AD' },
    { key:10,  label:'Ritmo',       cls:'b-ritmo', color:'#7F8C8D' },
];
function getBandaKey(score) {
    if (score >= 160) return 160;
    if (score >= 100) return 100;
    if (score >= 60)  return 60;
    if (score >= 25)  return 25;
    return 10;
}

/* ═══════════════════════════════════════════════════════════════
   4. ESTADO
═══════════════════════════════════════════════════════════════ */
let dicionario          = [];
let alvoAtual           = null;   // perfilFonetico() ou null (modo Construtor)

// Filtros absolutos — null = inativo
// Quando ativo, o item passa APENAS se item[campo] === valor.
let FILTROS = {
    numSilabas:     null,
    acentuacao:     null,
    vogalTonica:    null,
    onsetTonico:    null,
    familiaCluster: null,
    rimaPerfeita:   null,
    vogaisRima:     null,
    espinhaVocal:   null,
};

let resultadosFiltrados = [];
let itemsRenderizados   = 0;
const CHUNK             = 60;
let iObserver           = null;   // IntersectionObserver
let buildSilabas        = 0;      // estado do stepper do Construtor

/* ═══════════════════════════════════════════════════════════════
   5. INDEXAÇÃO
═══════════════════════════════════════════════════════════════ */
async function indexarDicionario() {
    let st  = document.getElementById('status-text');
    let inp = document.getElementById('input-palavra');
    st.textContent = 'Baixando palavras.txt…';
    try {
        const resp = await fetch('./palavras.txt');
        if (!resp.ok) throw new Error(`HTTP ${resp.status}`);
        const lista = (await resp.text()).split(/\r?\n/)
            .map(p => p.trim())
            .filter(p => p.length > 1 && /[a-záàâãéêíóôõúü]/i.test(p));
        st.textContent = `Indexando ${lista.length.toLocaleString('pt-BR')} palavras…`;
        setTimeout(() => {
            dicionario = lista.map(p => perfilFonetico(p)).filter(Boolean);
            st.textContent = `✅ ${dicionario.length.toLocaleString('pt-BR')} palavras prontas`;
            inp.disabled = false;
            document.getElementById('empty-state').innerHTML =
                `Banco com <b>${dicionario.length.toLocaleString('pt-BR')}</b> palavras carregado.<br>
                 Digite no <b>Molde</b> ou explore pelo <b>Construtor</b>.`;
        }, 30);
    } catch(e) {
        st.textContent = '⚠️ Erro ao carregar palavras.txt';
        document.getElementById('empty-state').innerHTML =
            'Não foi possível carregar <b>palavras.txt</b>.<br>Abra via servidor local.';
        console.error(e);
    }
}

/* ═══════════════════════════════════════════════════════════════
   6. PROCESSAMENTO CENTRAL
═══════════════════════════════════════════════════════════════ */
function processarBusca() {
    // Exige ao menos um critério para não retornar todo o dicionário
    let temCriterio = alvoAtual !== null || Object.values(FILTROS).some(v => v !== null);
    if (!temCriterio) {
        resultadosFiltrados = [];
        renderResultados();
        return;
    }

    // Aplica filtros absolutos (todos os campos de FILTROS que estão ativos)
    let base = alvoAtual
        ? dicionario.filter(i => i.palavra !== alvoAtual.palavra)
        : dicionario;

    let filtrados = base.filter(item => {
        for (let [k, v] of Object.entries(FILTROS)) {
            if (v !== null && item[k] !== v) return false;
        }
        return true;
    });

    if (alvoAtual) {
        // Com palavra-base: pontua, descarta score=0, ordena por score DESC
        let setOnset = new Set(alvoAtual.onsetTonico);
        let setAssC  = new Set(alvoAtual.assConsonantal);
        let lenAssC  = alvoAtual.assConsonantal.length;
        resultadosFiltrados = filtrados
            .map(i => ({ ...i, score: calcScore(i, alvoAtual, setOnset, setAssC, lenAssC) }))
            .filter(i => i.score > 0)
            .sort((a, b) => b.score - a.score);
    } else {
        // Sem palavra-base: filtra o dicionário estruturalmente, ordena A–Z
        resultadosFiltrados = filtrados
            .map(i => ({ ...i, score: 0 }))
            .sort((a, b) => a.palavra.localeCompare(b.palavra, 'pt-BR'));
    }

    renderResultados();
}

/* ═══════════════════════════════════════════════════════════════
   7. RENDERIZAÇÃO — header + infinite scroll (IntersectionObserver)
═══════════════════════════════════════════════════════════════ */
function renderResultados() {
    let grid = document.getElementById('grid');
    grid.innerHTML = '';
    itemsRenderizados = 0;
    if (iObserver) iObserver.disconnect();

    let n = resultadosFiltrados.length;

    // Header (contagem + chips de faixa)
    let header = document.getElementById('results-header');
    if (n === 0) {
        header.style.display = 'none';
        grid.innerHTML = `<div class="empty-state">Nenhuma palavra atende a estes critérios.<br>Destrave alguns blocos ou ajuste os filtros.</div>`;
        return;
    }
    header.style.display = 'flex';
    document.getElementById('count-label').textContent =
        `${n.toLocaleString('pt-BR')} palavra${n !== 1 ? 's' : ''}`;

    // Chips de faixa só aparecem no modo Molde (quando há score)
    let chipsEl = document.getElementById('bands-chips');
    if (alvoAtual) {
        let counts = {};
        BANDAS.forEach(b => counts[b.key] = 0);
        resultadosFiltrados.forEach(r => counts[getBandaKey(r.score)]++);
        chipsEl.innerHTML = BANDAS
            .filter(b => counts[b.key] > 0)
            .map(b => `<span class="band-chip" style="background:${b.color}">${b.label} ${counts[b.key]}</span>`)
            .join('');
    } else {
        chipsEl.innerHTML = '';
    }

    // Primeiro chunk imediato; o observer carrega o resto
    renderChunk();
    setupObserver();
}

function setupObserver() {
    let sentinel = document.getElementById('sentinel');
    iObserver = new IntersectionObserver(entries => {
        if (entries[0].isIntersecting) renderChunk();
    }, { root: document.getElementById('viewport'), rootMargin: '120px' });
    iObserver.observe(sentinel);
}

function renderChunk() {
    if (itemsRenderizados >= resultadosFiltrados.length) return;
    let chunk = resultadosFiltrados.slice(itemsRenderizados, itemsRenderizados + CHUNK);
    let frag  = document.createDocumentFragment();
    chunk.forEach(item => {
        let card = document.createElement('div');
        if (alvoAtual && item.score > 0) {
            let b = BANDAS.find(b => b.key === getBandaKey(item.score));
            card.className = `word-card ${b.cls}`;
        } else {
            card.className = 'word-card';
        }
        card.dataset.palavra = item.palavra;
        // Sílabas com tônica destacada — sem número de score visível
        card.innerHTML = item.silabas
            .map((s, i) => i === item.tonicaIndex ? `<span class="tonica">${s}</span>` : s)
            .join('·');
        frag.appendChild(card);
    });
    document.getElementById('grid').appendChild(frag);
    itemsRenderizados += chunk.length;
}

/* ═══════════════════════════════════════════════════════════════
   8. MOLDE — palavra-base → lego pills (blocos fonéticos)
═══════════════════════════════════════════════════════════════ */

// Definição dos blocos extraíveis de um perfil fonético.
// Cada bloco pode ser travado como filtro absoluto.
const DEF_BLOCOS = [
    { id: 'numSilabas',     label: v => `${v} síl.`,                           show: ()  => true             },
    { id: 'acentuacao',     label: v => ACENT_LABEL[v] || v,                   show: ()  => true             },
    { id: 'vogalTonica',    label: v => `vogal /${v.toUpperCase()}/`,           show: ()  => true             },
    { id: 'onsetTonico',    label: v => `onset /${v}/`,                         show: v   => v !== ''         },
    { id: 'familiaCluster', label: v => FAM_LABEL[v] || v,                     show: v   => v!=='si'&&v!=='vz'},
    { id: 'rimaPerfeita',   label: v => `rima: -${v}`,                         show: ()  => true             },
    { id: 'vogaisRima',     label: v => `vogRima: ${v}`,                       show: v   => v.length > 1     },
    { id: 'espinhaVocal',   label: v => `espinha: ${v}`,                       show: v   => v.length > 1     },
];

function setAlvoPalavra(palavra) {
    let perfil = perfilFonetico(palavra);
    if (!perfil) return;
    alvoAtual = perfil;

    // Limpa filtros Molde-específicos para evitar conflito com a nova palavra
    ['rimaPerfeita','vogaisRima','espinhaVocal','onsetTonico','familiaCluster'].forEach(k => FILTROS[k] = null);

    document.getElementById('input-palavra').value = palavra;
    renderLegoPanel();
    processarBusca();
    document.getElementById('viewport').scrollTo({ top: 0, behavior: 'smooth' });
    document.getElementById('bottom-panel').classList.remove('collapsed');
    if (navigator.vibrate) navigator.vibrate(30);
}

function renderLegoPanel() {
    let panel = document.getElementById('lego-panel');
    if (!alvoAtual) {
        panel.innerHTML = '<span class="lego-hint">Digite uma palavra para extrair blocos fonéticos.</span>';
        return;
    }
    panel.innerHTML = DEF_BLOCOS.map(def => {
        let val = alvoAtual[def.id];
        if (!def.show(val)) return '';
        let locked = FILTROS[def.id] !== null;
        return `<button class="lego-pill${locked ? ' locked' : ''}" onclick="toggleLego('${def.id}')">
                    ${locked ? '🔒 ' : ''}${def.label(val)}
                </button>`;
    }).join('');
}

function toggleLego(id) {
    if (!alvoAtual) return;
    let wasLocked = FILTROS[id] !== null;
    FILTROS[id] = wasLocked ? null : alvoAtual[id];
    if (navigator.vibrate) navigator.vibrate(wasLocked ? 15 : 45);
    renderLegoPanel();
    processarBusca();
    document.getElementById('viewport').scrollTo({ top: 0, behavior: 'smooth' });
}

/* ═══════════════════════════════════════════════════════════════
   9. CONSTRUTOR — busca estrutural sem palavra-base
═══════════════════════════════════════════════════════════════ */

// Usar qualquer controle do Construtor limpa a palavra-base (modos mutuamente exclusivos).
function _ativarConstrutor() {
    if (!alvoAtual) return;          // já no modo Construtor
    alvoAtual = null;
    // Preserva filtros estruturais compatíveis; limpa os Molde-específicos
    ['rimaPerfeita','vogaisRima','espinhaVocal','onsetTonico','familiaCluster'].forEach(k => FILTROS[k] = null);
    document.getElementById('input-palavra').value = '';
    renderLegoPanel();
}

function stepSilabas(delta) {
    _ativarConstrutor();
    buildSilabas = Math.max(0, buildSilabas + delta);
    FILTROS.numSilabas = buildSilabas === 0 ? null : buildSilabas;
    document.getElementById('step-val').textContent = buildSilabas === 0 ? 'Qualquer' : buildSilabas;
    if (navigator.vibrate) navigator.vibrate(20);
    processarBusca();
}

function setAcento(val, btn) {
    _ativarConstrutor();
    document.querySelectorAll('.radio-btn').forEach(b => b.classList.remove('selected'));
    btn.classList.add('selected');
    FILTROS.acentuacao = val;
    if (navigator.vibrate) navigator.vibrate(20);
    processarBusca();
}

function setVogal(v, btn) {
    _ativarConstrutor();
    let jaSelecionado = btn.classList.contains('selected');
    document.querySelectorAll('.vowel-btn').forEach(b => b.classList.remove('selected'));
    FILTROS.vogalTonica = jaSelecionado ? null : v;
    if (!jaSelecionado) btn.classList.add('selected');
    if (navigator.vibrate) navigator.vibrate(jaSelecionado ? 15 : 40);
    processarBusca();
}

// Sincroniza os controles do Construtor com o estado atual de FILTROS
// (chamado ao entrar na aba Construtor)
function _syncConstrutorUI() {
    buildSilabas = FILTROS.numSilabas || 0;
    document.getElementById('step-val').textContent = buildSilabas === 0 ? 'Qualquer' : buildSilabas;
    document.querySelectorAll('.radio-btn').forEach(b => {
        b.classList.toggle('selected', (b.dataset.acento || null) === FILTROS.acentuacao);
    });
    document.querySelectorAll('.vowel-btn').forEach(b => {
        b.classList.toggle('selected', b.dataset.vogal === FILTROS.vogalTonica);
    });
}

/* ═══════════════════════════════════════════════════════════════
   10. PAINEL — abas + colapso automático no scroll
═══════════════════════════════════════════════════════════════ */
const bottomPanel = document.getElementById('bottom-panel');

function switchTab(nome) {
    bottomPanel.classList.remove('collapsed');
    document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
    document.querySelectorAll('.tab-content').forEach(c => c.classList.remove('active'));
    document.getElementById('tab-btn-' + nome).classList.add('active');
    document.getElementById('tab-' + nome).classList.add('active');
    if (nome === 'construtor') _syncConstrutorUI();
    if (nome === 'molde') document.getElementById('input-palavra').focus();
}

function togglePanelCollapse() {
    bottomPanel.classList.toggle('collapsed');
}

// Rola para baixo → recolhe painel; rola para cima → expande
let _lastScrollY = 0;
document.getElementById('viewport').addEventListener('scroll', function () {
    let y = this.scrollTop;
    if      (y > 80 && y > _lastScrollY + 14)  bottomPanel.classList.add('collapsed');
    else if (y < _lastScrollY - 14)             bottomPanel.classList.remove('collapsed');
    _lastScrollY = y;
});

/* ═══════════════════════════════════════════════════════════════
   11. EVENTOS
═══════════════════════════════════════════════════════════════ */

// Card clicado → nova busca no Molde
document.getElementById('grid').addEventListener('click', e => {
    let card = e.target.closest('.word-card');
    if (!card || !card.dataset.palavra) return;
    switchTab('molde');
    setAlvoPalavra(card.dataset.palavra);
});

// Input do Molde: debounce 280ms enquanto digita; imediato no Enter
let _debounce;
document.getElementById('input-palavra').addEventListener('input', e => {
    let val = e.target.value.trim();
    clearTimeout(_debounce);
    if (val.length < 2) return;
    _debounce = setTimeout(() => { let p = perfilFonetico(val); if (p) setAlvoPalavra(val); }, 280);
});
document.getElementById('input-palavra').addEventListener('keypress', e => {
    if (e.key !== 'Enter') return;
    clearTimeout(_debounce);
    let val = e.target.value.trim();
    if (val.length >= 2) setAlvoPalavra(val);
    e.target.blur();   // fecha o teclado no mobile
});

/* ═══════════════════════════════════════════════════════════════
   12. VOZ — Web Speech API (progressiva: não quebra se ausente)
═══════════════════════════════════════════════════════════════ */
(function setupVoice() {
    let SR = window.SpeechRecognition || window.webkitSpeechRecognition;
    if (!SR) return;
    let mic   = document.getElementById('btn-mic');
    let recog = new SR();
    recog.lang = 'pt-BR';
    recog.maxAlternatives = 1;
    mic.classList.add('visible');
    mic.onclick = () => {
        try { recog.start(); mic.classList.add('listening'); } catch(e) {}
    };
    recog.onresult = e => {
        let texto  = e.results[0][0].transcript.trim();
        let ultima = texto.split(/\s+/).pop();   // pega a última palavra da frase
        switchTab('molde');
        setAlvoPalavra(ultima);
    };
    recog.onend  = () => mic.classList.remove('listening');
    recog.onerror = () => mic.classList.remove('listening');
})();

/* ═══════════════════════════════════════════════════════════════
   13. INIT
═══════════════════════════════════════════════════════════════ */
window.onload = indexarDicionario;
</script>
