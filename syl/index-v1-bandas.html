<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Explorador de Sonoridades</title>
    <style>
        :root {
            --primary: #2C3E50;
            --accent:  #E74C3C;
            --bg:      #ECF0F1;
            --c-rima:  #27AE60;
            --c-eco:   #2980B9;
            --c-ass:   #E67E22;
            --c-prox:  #8E44AD;
            --c-ritmo: #7F8C8D;
        }
        body { font-family: 'Segoe UI', Tahoma, sans-serif; background: var(--bg); color: var(--primary); padding: 20px; display: flex; flex-direction: column; align-items: center; margin: 0; }
        .container { width: 100%; max-width: 960px; background: white; padding: 30px; border-radius: 8px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); box-sizing: border-box; }
        h1 { text-align: center; margin-top: 0; color: var(--primary); font-size: 22px; }

        /* Search bar */
        .search-box { display: flex; gap: 8px; margin-bottom: 16px; }
        input[type="text"] { flex: 1; padding: 12px 14px; font-size: 17px; border: 1px solid #BDC3C7; border-radius: 4px; outline: none; transition: border 0.2s; }
        input[type="text"]:focus { border-color: var(--accent); }
        .btn-buscar { background: var(--primary); color: white; border: none; padding: 12px 24px; font-size: 16px; border-radius: 4px; cursor: pointer; transition: background 0.2s; font-weight: bold; white-space: nowrap; }
        .btn-buscar:hover { background: var(--accent); }
        .btn-buscar:disabled { background: #95A5A6; cursor: not-allowed; }
        .status { text-align: center; font-size: 14px; color: #7f8c8d; margin-bottom: 20px; padding: 8px 12px; background: #F4F6F6; border-radius: 4px; }

        /* Phonetic profile box */
        .perfil-box { background: #f8f9fa; border-left: 3px solid var(--accent); padding: 11px 16px; margin-bottom: 14px; border-radius: 0 4px 4px 0; display: none; }
        .perfil-word { font-size: 21px; letter-spacing: 2px; margin-bottom: 5px; }
        .tonica-inline { color: var(--accent); font-weight: bold; }
        .perfil-data { font-size: 12px; color: #666; }
        .tag { display: inline-block; background: #e8ecef; border-radius: 3px; padding: 1px 6px; margin: 2px 2px 2px 0; }

        /* ── Band toggles ─────────────────────────────── */
        .banda-panel {
            display: none;
            flex-wrap: wrap;
            align-items: center;
            gap: 8px;
            padding: 14px 16px;
            margin-bottom: 14px;
            background: #f8f9fa;
            border-radius: 6px;
            border: 1px solid #e2e6ea;
        }
        .banda-label { font-size: 12px; color: #888; width: 100%; margin-bottom: 2px; }
        .banda-btn {
            border: 2px solid var(--bc);
            background: white;
            color: var(--bc);
            padding: 6px 14px;
            border-radius: 20px;
            cursor: pointer;
            font-size: 13px;
            line-height: 1.3;
            transition: all 0.15s;
            text-align: center;
        }
        .banda-btn small { display: block; font-size: 10px; opacity: 0.75; margin-top: 1px; }
        .banda-btn.ativo { background: var(--bc); color: white; }
        .banda-btn:hover  { opacity: 0.82; }
        /* Count badge inside inactive button gets colored on hover */

        /* ── Facet panel ──────────────────────────────── */
        .facet-panel { background: #fef9e7; border: 1px solid #f0c040; border-radius: 6px; padding: 11px 14px; margin-bottom: 12px; display: none; }
        .facet-header { font-weight: bold; font-size: 13px; margin-bottom: 8px; color: #555; }
        .facet-row { display: flex; align-items: center; flex-wrap: wrap; gap: 5px; margin-bottom: 6px; }
        .facet-lbl { font-size: 12px; color: #888; min-width: 58px; }
        .facet-btn { padding: 3px 10px; font-size: 12px; border: 1px solid #ccc; border-radius: 20px; background: white; cursor: pointer; transition: all 0.12s; font-weight: normal; }
        .facet-btn:hover  { border-color: var(--accent); color: var(--accent); background: white; }
        .facet-btn.ativo  { background: var(--primary); color: white; border-color: var(--primary); }
        .facet-clear { margin-top: 5px; background: none; color: #aaa; border: none; font-size: 11px; cursor: pointer; padding: 0; font-weight: normal; }
        .facet-clear:hover { color: var(--accent); background: none; }

        /* ── Results ──────────────────────────────────── */
        #resultadosMsg { margin-bottom: 8px; font-size: 14px; color: #555; }
        .results-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(128px, 1fr)); gap: 8px; }
        .word-card {
            border: 2px solid #e2e6ea;
            background: #f8f9fa;
            padding: 10px 6px 5px;
            border-radius: 6px;
            text-align: center;
            font-size: 16px;
            cursor: pointer;
            transition: transform 0.12s, box-shadow 0.12s;
        }
        .word-card:hover { transform: translateY(-2px); box-shadow: 0 4px 10px rgba(0,0,0,0.1); background: white; }
        /* border colors match band colors */
        .word-card.b-rima  { border-color: var(--c-rima); }
        .word-card.b-eco   { border-color: var(--c-eco); }
        .word-card.b-ass   { border-color: var(--c-ass); }
        .word-card.b-prox  { border-color: var(--c-prox); }
        .word-card.b-ritmo { border-color: var(--c-ritmo); }
        .tonica { font-weight: bold; color: var(--accent); }
        .score-num { display: block; font-size: 10px; color: #ccc; margin-top: 2px; }

        /* ── Pagination ───────────────────────────────── */
        .paginacao { display: flex; justify-content: center; align-items: center; gap: 12px; margin-top: 18px; font-size: 13px; color: #666; }
        .paginacao button { background: var(--primary); color: white; border: none; padding: 6px 14px; border-radius: 4px; cursor: pointer; font-size: 13px; }
        .paginacao button:hover { background: var(--accent); }
        .paginacao button:disabled { background: #ccc; cursor: default; }
    </style>
</head>
<body>
<div class="container">
    <h1>Explorador de Sonoridades</h1>
    <div class="status" id="statusText">Aguardando inicialização...</div>

    <div class="search-box">
        <input type="text" id="inputPalavra" placeholder="Ex: abstrato, amor, sílaba, cidade...">
        <button class="btn-buscar" id="btnBuscar" onclick="buscarRimas()" disabled>Buscar</button>
    </div>

    <!-- Phonetic profile of target word -->
    <div class="perfil-box" id="perfilAlvo"></div>

    <!--
        FAIXAS DE PROXIMIDADE — cada botão é uma faixa de score.
        Estão todas ativas por padrão; desativar uma faixa a REMOVE dos resultados.
        Isso permite ver só um recorte específico (ex: só assonância, sem rimas perfeitas).

        Rima        ≥ 160   — rima perfeita (critério clássico)
        Eco forte   100–159 — vários critérios se sobrepõem
        Assonância   60–99  — vogais ressoam, sem rima exata
        Proximidade  25–59  — conexão consonantal ou espinha (zona soramimi)
        Ritmo        10–24  — só padrão silábico e acentual em comum
    -->
    <div class="banda-panel" id="bandaPanel"></div>

    <!-- Syllable/accent facets — appear when results > 100 -->
    <div class="facet-panel" id="facetPanel"></div>

    <div id="resultadosMsg"></div>
    <div class="results-grid" id="resultadosGrid"></div>
    <div class="paginacao" id="paginacao"></div>
</div>

<script>
// ═══════════════════════════════════════════════════════════════
// 1. MOTOR PROSÓDICO — silabificação (algoritmo original inalterado)
// ═══════════════════════════════════════════════════════════════
const vRegex = /[aeiouáàâãéêíóôõúü]/i;

function tratarHiatosVogais(blocoVoc, pLower) {
    if (blocoVoc.length <= 1) return [blocoVoc];
    let resultado = [], atual = blocoVoc[0];
    for (let i = 1; i < blocoVoc.length; i++) {
        let char = blocoVoc[i], par = (atual.slice(-1) + char).toLowerCase();
        let formamDitongo   = /^(ai|au|ei|eu|iu|oi|ou|ui|ão|õe|ãe|ia|ie|io|ua|ue|uo)$/.test(par);
        let vogaisIdenticas = par[0] === par[1];
        let temHiatoAcent   = /[aeiouáéíóúâêôãõü][íú]/.test(par);
        let ehHiatoFinal    = /^(ai|ui|au|oe)$/.test(par) &&
                              (pLower.endsWith(par+"r")||pLower.endsWith(par+"z")||pLower.endsWith(par+"l"));
        let seguidoDeNh     = pLower.includes(par+"nh");
        let formaHiatoDit   = false;
        if (blocoVoc.length >= 3 && /^[aeo]$/.test(atual.slice(-1))) {
            let prox = blocoVoc[i+1] ? blocoVoc[i+1].toLowerCase() : "";
            if (/^(iu|ia|io|ie|ui)$/.test(char+prox)) formaHiatoDit = true;
        }
        if (formamDitongo && !temHiatoAcent && !vogaisIdenticas && !ehHiatoFinal && !seguidoDeNh && !formaHiatoDit)
            atual += char;
        else { resultado.push(atual); atual = char; }
    }
    resultado.push(atual);
    return resultado;
}

function separarConsoantes(cBlock) {
    if (cBlock.length <= 1) return ["", cBlock];
    let tL = cBlock.toLowerCase();
    if (cBlock.length === 2) {
        if (/^(ch|lh|nh|gu|qu|br|cr|dr|fr|gr|pr|tr|vr|bl|cl|fl|gl|pl|tl)$/.test(tL)) return ["", cBlock];
        return [cBlock.slice(0,1), cBlock.slice(1)];
    }
    if (/^(ch|lh|nh|gu|qu|br|cr|dr|fr|gr|pr|tr|vr|bl|cl|fl|gl|pl|tl)$/.test(tL.slice(-2)))
        return [cBlock.slice(0,-2), cBlock.slice(-2)];
    return [cBlock.slice(0,-1), cBlock.slice(-1)];
}

function silabificar(palavra) {
    let blocos = [], tipoAt = '', textoAt = '';
    for (let i = 0; i < palavra.length; i++) {
        let ch = palavra[i], chL = ch.toLowerCase();
        if ((chL==='q'||chL==='g') && palavra[i+1] && palavra[i+1].toLowerCase()==='u'
            && palavra[i+2] && vRegex.test(palavra[i+2])) {
            if (tipoAt==='V') { blocos.push({tipo:'V',texto:textoAt}); textoAt=''; }
            blocos.push({tipo:'C',texto:ch+palavra[i+1]}); i++; tipoAt=''; continue;
        }
        let tipo = vRegex.test(ch) ? 'V' : 'C';
        if (tipo !== tipoAt) { if (textoAt) blocos.push({tipo:tipoAt,texto:textoAt}); tipoAt=tipo; textoAt=ch; }
        else textoAt += ch;
    }
    if (textoAt) blocos.push({tipo:tipoAt,texto:textoAt});
    let bExp = [];
    for (let b of blocos) {
        if (b.tipo==='V') tratarHiatosVogais(b.texto, palavra.toLowerCase()).forEach(v=>bExp.push({tipo:'V',texto:v}));
        else bExp.push(b);
    }
    let idxV = bExp.reduce((a,b,i)=>(b.tipo==='V'?[...a,i]:a),[]);
    if (!idxV.length) return [palavra];
    let sil = new Array(idxV.length).fill("");
    for (let i=0; i<idxV[0]; i++) sil[0] += bExp[i].texto;
    for (let k=0; k<idxV.length-1; k++) {
        sil[k] += bExp[idxV[k]].texto;
        let cT=""; for (let j=idxV[k]+1; j<idxV[k+1]; j++) cT+=bExp[j].texto;
        let [esq,dir] = separarConsoantes(cT); sil[k]+=esq; sil[k+1]+=dir;
    }
    let uV = idxV[idxV.length-1];
    sil[sil.length-1] += bExp[uV].texto;
    for (let i=uV+1; i<bExp.length; i++) sil[sil.length-1]+=bExp[i].texto;
    return sil;
}

function identificarTonica(silabas, p) {
    let t = p.toLowerCase();
    for (let i=0;i<silabas.length;i++) if(/[áéíóúâêô]/i.test(silabas[i])) return i;
    for (let i=0;i<silabas.length;i++) if(/[ãõ]/i.test(silabas[i])) return i;
    if (t.match(/(r|l|z|x|i|is|u|us|im|ins|um|uns)$/)) return silabas.length-1;
    if (t.match(/(a|as|e|es|o|os|am|em|ens)$/))        return Math.max(0,silabas.length-2);
    return Math.max(0,silabas.length-2);
}

function extrairBaseRima(silabas, ti) {
    let pf=silabas.slice(ti).join(''), m=pf.match(vRegex);
    return m ? pf.slice(m.index).toLowerCase() : pf.toLowerCase();
}

// ═══════════════════════════════════════════════════════════════
// 2. CAMPOS FONÉTICOS — calculados uma vez na indexação
// ═══════════════════════════════════════════════════════════════
// Remove acentos agudos/circunflexos mas preserva ã, õ (nasais são classe distinta)
function normV(s) {
    return s.toLowerCase()
        .replace(/[áàâ]/g,'a').replace(/[éê]/g,'e').replace(/í/g,'i')
        .replace(/[óô]/g,'o').replace(/[úü]/g,'u');
}
const CLUSTER_FAM = {
    br:'pl',cr:'pl',dr:'pl',fr:'fl',gr:'pl',pr:'pl',tr:'pl',vr:'fl',
    bl:'pl',cl:'pl',fl:'fl',gl:'pl',pl:'pl',tl:'pl',
    ch:'af',lh:'lp',nh:'np'
};
const FAM_LABEL  = {pl:'plosiva+líquida',fl:'fricativa+líquida',af:'africada',lp:'lateral palatal',np:'nasal palatal',si:'simples',vz:'—',cx:'complexo'};
const ACENT_LABEL = {ox:'Oxítona',px:'Paroxítona',ppx:'Proparoxítona',spx:'Superproparox.'};

function calcOnset(sil) { let m=sil.match(/^([^aeiouáàâãéêíóôõúü]*)/i); return m?m[1].toLowerCase():''; }
function calcVogalT(sil) { let m=sil.match(/[aeiouáàâãéêíóôõúü]/i); return m?normV(m[0]):''; }
function calcVogaisRima(sil,ti) { return normV(sil.slice(ti).join('')).replace(/[^aeiouãõ]/g,''); }
function calcEspinha(p) { return normV(p).replace(/[^aeiouãõ]/g,''); }
function calcAssC(sil,ti) {
    let span=sil.slice(ti).join('').toLowerCase().replace(/[aeiouáàâãéêíóôõúü]/g,'');
    return [...new Set(span)].sort().join('');
}
function calcFam(o) { return !o?'vz':o.length===1?'si':(CLUSTER_FAM[o]||'cx'); }
function calcAcent(sil,ti) { let d=sil.length-1-ti; return d===0?'ox':d===1?'px':d===2?'ppx':'spx'; }

function perfilFonetico(palavra) {
    let pL=palavra.toLowerCase().trim();
    if (!pL||!/[a-záàâãéêíóôõúü]/i.test(pL)) return null;
    let sil=silabificar(pL), ti=identificarTonica(sil,pL), onset=calcOnset(sil[ti]);
    return {
        palavra:pL, silabas:sil, tonicaIndex:ti, numSilabas:sil.length,
        rimaPerfeita:extrairBaseRima(sil,ti), terminacao:pL.slice(-2),
        onsetTonico:onset, vogalTonica:calcVogalT(sil[ti]),
        vogaisRima:calcVogaisRima(sil,ti), espinhaVocal:calcEspinha(pL),
        assConsonantal:calcAssC(sil,ti), familiaCluster:calcFam(onset),
        acentuacao:calcAcent(sil,ti)
    };
}

// ═══════════════════════════════════════════════════════════════
// 3. SISTEMA DE PONTUAÇÃO COMPOSTA
// ═══════════════════════════════════════════════════════════════
//
//  Rima perfeita          +100   tônica→fim: tudo idêntico
//  Assonância             + 60   tônica→fim: só vogais coincidem
//  Eco consonantal exato  + 50   onset tônico idêntico
//  Consonante compartilh. + 25   onset tem ≥1 consoante em comum
//  Família de cluster     + 20   mesmo tipo estrutural (plosiva+líq etc.)
//  Assin. consonantal     + 30   Jaccard ≥ 0.5 nas consoantes do span
//  Espinha vocal          + 40   sequência completa de vogais da palavra
//  Vogal tônica           + 15   só a vogal central coincide
//  Padrão rítmico         + 10   mesmo nº sílabas + mesmo tipo de acento
//  ─────────────────────────────────────────────────────────────
//  Máximo teórico: 350 pts
//
// As faixas de navegação resultantes:
//   Rima        ≥ 160  — rima perfeita (inclui assonância + ritmo)
//   Eco forte  100–159 — múltiplos critérios se sobrepõem
//   Assonância  60–99  — ressonância vocálica sem rima exata
//   Proximidade 25–59  — conexão consonantal ou espinha (zona soramimi)
//   Ritmo       10–24  — só estrutura silábica e acentual

// setOnset e setAssC são pré-computados fora do loop para performance
function calcScore(item, alvo, setOnset, setAssC, lenAssC) {
    let s = 0;

    if (item.rimaPerfeita === alvo.rimaPerfeita)                        s += 100;
    if (alvo.vogaisRima && item.vogaisRima === alvo.vogaisRima)         s +=  60;

    if (alvo.onsetTonico) {
        if (item.onsetTonico === alvo.onsetTonico) {
            s += 50;
        } else if (item.onsetTonico) {
            for (let c of item.onsetTonico) { if (setOnset.has(c)) { s += 25; break; } }
        }
    }

    if (alvo.familiaCluster !== 'vz' && alvo.familiaCluster !== 'si'
        && item.familiaCluster === alvo.familiaCluster) s += 20;

    if (lenAssC > 0 && item.assConsonantal) {
        // Jaccard sem criar Set por iteração: ambas as strings já são únicos ordenados
        let inter = 0;
        for (let c of item.assConsonantal) if (setAssC.has(c)) inter++;
        let union = lenAssC + item.assConsonantal.length - inter;
        if (union > 0 && inter / union >= 0.5) s += 30;
    }

    if (alvo.espinhaVocal.length > 1 && item.espinhaVocal === alvo.espinhaVocal) s += 40;
    if (alvo.vogalTonica && item.vogalTonica === alvo.vogalTonica)      s +=  15;
    if (item.numSilabas === alvo.numSilabas && item.acentuacao === alvo.acentuacao) s += 10;

    return s;
}

// ═══════════════════════════════════════════════════════════════
// 4. INDEXAÇÃO
// ═══════════════════════════════════════════════════════════════
let dicionarioIndexado = [];

async function indexarDicionario() {
    let stEl=document.getElementById("statusText"), btn=document.getElementById("btnBuscar");
    stEl.innerText = "Baixando palavras...";
    try {
        const resp = await fetch('./palavras.txt');
        if (!resp.ok) throw new Error(`HTTP ${resp.status}`);
        const lista = (await resp.text()).split(/\r?\n/)
            .map(p=>p.trim()).filter(p=>p.length>1&&/[a-záàâãéêíóôõúü]/i.test(p));
        stEl.innerText = `Indexando ${lista.length} palavras...`;
        setTimeout(()=>{
            let t0=performance.now();
            dicionarioIndexado = lista.map(p=>perfilFonetico(p)).filter(Boolean);
            stEl.innerHTML = `✅ <b>${dicionarioIndexado.length}</b> palavras indexadas em ${(performance.now()-t0).toFixed(0)}ms`;
            btn.disabled = false;
            document.getElementById("inputPalavra").focus();
        }, 50);
    } catch(e) {
        document.getElementById("statusText").innerHTML = `<span style="color:red"><b>Erro ao carregar palavras.txt</b></span>`;
        console.error(e);
    }
}

// ═══════════════════════════════════════════════════════════════
// 5. FAIXAS DE SCORE — definição e helpers
// ═══════════════════════════════════════════════════════════════
const BANDAS = [
    { key:160, label:'Rima',        range:'≥ 160',   cls:'b-rima',  cssVar:'var(--c-rima)'  },
    { key:100, label:'Eco forte',   range:'100–159', cls:'b-eco',   cssVar:'var(--c-eco)'   },
    { key:60,  label:'Assonância',  range:'60–99',   cls:'b-ass',   cssVar:'var(--c-ass)'   },
    { key:25,  label:'Proximidade', range:'25–59',   cls:'b-prox',  cssVar:'var(--c-prox)'  },
    { key:10,  label:'Ritmo',       range:'10–24',   cls:'b-ritmo', cssVar:'var(--c-ritmo)' }
];

function getBandaKey(score) {
    if (score >= 160) return 160;
    if (score >= 100) return 100;
    if (score >= 60)  return 60;
    if (score >= 25)  return 25;
    return 10;
}

// ═══════════════════════════════════════════════════════════════
// 6. BUSCA — pontua tudo, depois filtra por faixas ativas
// ═══════════════════════════════════════════════════════════════
let resultadosCompletos = [];   // todos os resultados com score > 0
let bandasAtivas  = new Set([160,100,60,25,10]); // faixas visíveis
let facetAtivos   = { sil: null, acent: null };
let pagAtual      = 0;
let alvoAtual     = null;

function buscarRimas() {
    let raw = document.getElementById("inputPalavra").value.trim();
    if (!raw) return;
    let alvo = perfilFonetico(raw);
    if (!alvo) return;
    alvoAtual = alvo;

    // Pré-computa Sets do alvo UMA vez antes do loop de 51 K palavras
    let setOnset = new Set(alvo.onsetTonico);
    let setAssC  = new Set(alvo.assConsonantal);
    let lenAssC  = alvo.assConsonantal.length;

    resultadosCompletos = dicionarioIndexado
        .filter(i => i.palavra !== alvo.palavra)
        .map(i => ({ ...i, score: calcScore(i, alvo, setOnset, setAssC, lenAssC) }))
        .filter(i => i.score > 0)
        .sort((a, b) => b.score - a.score);

    // Reseta estado
    bandasAtivas = new Set([160,100,60,25,10]);
    facetAtivos  = { sil: null, acent: null };
    pagAtual     = 0;

    mostrarPerfil(alvo);
    renderBandas();
    aplicarFiltros();
}

function aplicarFiltros() {
    // 1. Filtra pelas faixas ativas
    let porBanda = resultadosCompletos.filter(i => bandasAtivas.has(getBandaKey(i.score)));

    // 2. Filtra pelas facetas de sílabas/acento
    let final = porBanda.filter(r => {
        if (facetAtivos.sil   !== null && r.numSilabas  !== facetAtivos.sil)   return false;
        if (facetAtivos.acent !== null && r.acentuacao  !== facetAtivos.acent) return false;
        return true;
    });

    document.getElementById("resultadosMsg").innerHTML =
        final.length ? `<p><b>${final.length}</b> palavras — ordenadas por proximidade fonética</p>` : '';

    // Facetas aparecem quando há > 100 resultados nas faixas ativas
    if (porBanda.length > 100) renderFacetas(porBanda);
    else document.getElementById("facetPanel").style.display = 'none';

    renderPaginado(final);
}

// ═══════════════════════════════════════════════════════════════
// 7. BANDA PANEL — botões de faixa toggleáveis
// ═══════════════════════════════════════════════════════════════
function renderBandas() {
    // Conta palavras em cada faixa (usando resultadosCompletos, sem filtros)
    let counts = {};
    BANDAS.forEach(b => counts[b.key] = 0);
    resultadosCompletos.forEach(i => counts[getBandaKey(i.score)]++);

    let painel = document.getElementById("bandaPanel");
    painel.innerHTML = `
        <span class="banda-label">Faixas de proximidade — ative ou desative para recortar o resultado:</span>
        ${BANDAS.map(b => `
            <button class="banda-btn ${bandasAtivas.has(b.key)?'ativo':''}"
                    style="--bc:${b.cssVar}"
                    onclick="toggleBanda(${b.key})">
                ${b.label}
                <small>${b.range} &nbsp;·&nbsp; ${counts[b.key]} palavras</small>
            </button>
        `).join('')}
    `;
    painel.style.display = 'flex';
}

function toggleBanda(key) {
    if (bandasAtivas.has(key)) bandasAtivas.delete(key);
    else bandasAtivas.add(key);
    // Ao mudar a faixa, reseta facetas (evita combinação inconsistente)
    facetAtivos = { sil: null, acent: null };
    pagAtual    = 0;
    renderBandas();       // re-renderiza botões para refletir estado ativo/inativo
    aplicarFiltros();
}

// ═══════════════════════════════════════════════════════════════
// 8. FACET PANEL — sílabas e acento (refinamento dentro das faixas)
// ═══════════════════════════════════════════════════════════════
function renderFacetas(base) {
    let porSil = {}, porAcent = {};
    base.forEach(r => {
        porSil[r.numSilabas]   = (porSil[r.numSilabas]   || 0) + 1;
        porAcent[r.acentuacao] = (porAcent[r.acentuacao] || 0) + 1;
    });

    let silBtn = Object.keys(porSil).sort((a,b)=>+a-+b).map(k =>
        `<button class="facet-btn${facetAtivos.sil===+k?' ativo':''}" onclick="setFaceta('sil',${k})">${k} síl. <small>(${porSil[k]})</small></button>`
    ).join('');
    let acentBtn = Object.entries(porAcent).map(([k,v]) =>
        `<button class="facet-btn${facetAtivos.acent===k?' ativo':''}" onclick="setFaceta('acent','${k}')">${ACENT_LABEL[k]||k} <small>(${v})</small></button>`
    ).join('');

    let painel = document.getElementById("facetPanel");
    painel.innerHTML = `
        <div class="facet-header">Refinar ${base.length} resultados:</div>
        <div class="facet-row"><span class="facet-lbl">Sílabas</span>${silBtn}</div>
        <div class="facet-row"><span class="facet-lbl">Acento</span>${acentBtn}</div>
        <button class="facet-clear" onclick="limparFacetas()">✕ Limpar filtros</button>
    `;
    painel.style.display = 'block';
}

function setFaceta(tipo, valor) {
    facetAtivos[tipo] = facetAtivos[tipo] === valor ? null : valor; // toggle
    pagAtual = 0;
    aplicarFiltros();
}
function limparFacetas() {
    facetAtivos = { sil: null, acent: null };
    pagAtual    = 0;
    aplicarFiltros();
}

// ═══════════════════════════════════════════════════════════════
// 9. RENDERIZAÇÃO — grid paginado
// ═══════════════════════════════════════════════════════════════
const POR_PAG = 60;

function renderPaginado(resultados) {
    let grid  = document.getElementById("resultadosGrid");
    let pagEl = document.getElementById("paginacao");
    grid.innerHTML = '';

    if (!resultados.length) {
        grid.innerHTML = '<p style="color:#aaa;text-align:center;grid-column:1/-1">Nenhuma palavra nesta faixa.</p>';
        pagEl.innerHTML = '';
        return;
    }

    let fatia = resultados.slice(pagAtual * POR_PAG, (pagAtual+1) * POR_PAG);
    fatia.forEach(item => {
        let bk  = getBandaKey(item.score);
        let cls = BANDAS.find(b=>b.key===bk)?.cls || '';
        let div = document.createElement("div");
        div.className = `word-card ${cls}`;

        div.innerHTML = item.silabas.map((s,i) =>
            i===item.tonicaIndex ? `<span class="tonica">${s}</span>` : s
        ).join('') + `<span class="score-num">${item.score}</span>`;

        div.title   = `Score: ${item.score}`;
        div.onclick = () => { document.getElementById("inputPalavra").value = item.palavra; buscarRimas(); };
        grid.appendChild(div);
    });

    let total    = resultados.length;
    let totalPag = Math.ceil(total / POR_PAG);
    pagEl.innerHTML = totalPag <= 1 ? '' :
        `<button onclick="irPag(${pagAtual-1})" ${pagAtual===0?'disabled':''}>← Ant.</button>
         <span>${pagAtual+1} / ${totalPag} &nbsp;·&nbsp; ${total} palavras</span>
         <button onclick="irPag(${pagAtual+1})" ${pagAtual>=totalPag-1?'disabled':''}>Próx. →</button>`;
}

function irPag(n) {
    let tot = resultadosCompletos.filter(i=>bandasAtivas.has(getBandaKey(i.score))).length;
    if (n<0 || n>=Math.ceil(tot/POR_PAG)) return;
    pagAtual = n;
    aplicarFiltros();
    document.getElementById("resultadosGrid").scrollIntoView({behavior:'smooth'});
}

// ═══════════════════════════════════════════════════════════════
// 10. PERFIL FONÉTICO DO ALVO
// ═══════════════════════════════════════════════════════════════
function mostrarPerfil(alvo) {
    let silHTML = alvo.silabas.map((s,i) =>
        i===alvo.tonicaIndex ? `<b class="tonica-inline">${s.toUpperCase()}</b>` : s
    ).join('·');
    let famInfo = (alvo.familiaCluster!=='si'&&alvo.familiaCluster!=='vz')
        ? ` (${FAM_LABEL[alvo.familiaCluster]||alvo.familiaCluster})` : '';

    let box = document.getElementById("perfilAlvo");
    box.innerHTML = `
        <div class="perfil-word">${silHTML}</div>
        <div class="perfil-data">
            <span class="tag">${ACENT_LABEL[alvo.acentuacao]||alvo.acentuacao}</span>
            <span class="tag">${alvo.numSilabas} síl.</span>
            <span class="tag">vogal tônica: /${alvo.vogalTonica}/</span>
            <span class="tag">onset: ${alvo.onsetTonico||'∅'}${famInfo}</span>
            <span class="tag">vogais tôn.→fim: ${alvo.vogaisRima||'—'}</span>
            <span class="tag">espinha: ${alvo.espinhaVocal||'—'}</span>
            <span class="tag">assin. cons.: ${alvo.assConsonantal||'—'}</span>
        </div>
    `;
    box.style.display = 'block';
}

// ═══════════════════════════════════════════════════════════════
// 11. INICIALIZAÇÃO
// ═══════════════════════════════════════════════════════════════
document.getElementById("inputPalavra").addEventListener("keypress", e => {
    if (e.key==="Enter" && !document.getElementById("btnBuscar").disabled) buscarRimas();
});
window.onload = indexarDicionario;
</script>
